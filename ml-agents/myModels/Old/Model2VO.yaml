behaviors:
  "FlappyBird":
    trainer_type: ppo

    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 1.0e-4
      beta: 5.0e-4
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4

    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: nature_cnn

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 6000000
    time_horizon: 128
    summary_freq: 10000
